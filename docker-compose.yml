services:
  app:
    image: ${IMAGE:-ghcr.io/gusilda109/intentfence:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      # SQLite lives on the named volume so it survives redeploys.
      DATABASE_URL: file:/data/intentfence.db
    ports:
      # Loopback only: nginx on the host proxies to it, and Docker's iptables
      # rules would otherwise expose the port publicly past ufw.
      - "127.0.0.1:${APP_PORT:-3058}:3000"
    volumes:
      - data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3058/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  data:
